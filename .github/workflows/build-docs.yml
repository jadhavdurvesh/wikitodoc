name: Build DeepWiki Documentation

on:
  workflow_dispatch:
    inputs:
      deepwiki_url:
        description: DeepWiki repository URL
        required: false
        default: https://deepwiki.com/jadhavdurvesh/Maintain.ai.android
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium zip poppler-utils

      - name: Checkout DeepWiki exporter runtime
        run: |
          git clone --depth 1 https://github.com/suwa-sh/deepwiki-to-md.git .deepwiki-to-md

      - name: Build native DeepWiki exporter image
        run: |
          docker build --platform linux/amd64 -t local/deepwiki-to-md:latest .deepwiki-to-md

      - name: Export complete DeepWiki
        env:
          DEEPWIKI_URL: ${{ inputs.deepwiki_url || 'https://deepwiki.com/jadhavdurvesh/Maintain.ai.android' }}
        run: |
          rm -rf export raw-deepwiki
          mkdir -p export
          docker run --rm --init --ipc=host \
            -v "$GITHUB_WORKSPACE/export:/output" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            --entrypoint python \
            local/deepwiki-to-md:latest \
            /scripts/deepwiki_export.py "$DEEPWIKI_URL" -o /output

          echo "Exported files:"
          find export -type f -print | sort

          MD_COUNT="$(find export -name '*.md' | wc -l)"
          SVG_COUNT="$(find export -name '*.svg' | wc -l)"
          echo "Markdown pages: $MD_COUNT"
          echo "SVG diagrams: $SVG_COUNT"
          test "$MD_COUNT" -ge 18
          test "$SVG_COUNT" -gt 0

          mkdir -p raw-deepwiki
          cp -R export/. raw-deepwiki/

      - name: Build documentation HTML
        run: |
          python3 scripts/build_html.py export output/documentation.html
          SVG_COUNT="$(find export -name '*.svg' | wc -l)"
          EMBEDDED_COUNT="$(grep -o 'class="diagram"' output/documentation.html | wc -l)"
          echo "SVG diagrams exported: $SVG_COUNT"
          echo "Diagrams embedded into HTML: $EMBEDDED_COUNT"
          test "$SVG_COUNT" -gt 0
          test "$EMBEDDED_COUNT" -eq "$SVG_COUNT"

      - name: Build PDF
        run: |
          mkdir -p output
          chromium --headless --no-sandbox --disable-gpu --allow-file-access-from-files \
            --print-to-pdf="output/Maintain.ai-Android-Documentation.pdf" \
            "file://$GITHUB_WORKSPACE/output/documentation.html"

      - name: Package raw Markdown and assets
        run: |
          cd raw-deepwiki
          zip -r ../output/Maintain.ai-Android-Raw-Markdown.zip .

      - name: Validate generated documentation
        run: |
          pdfinfo output/Maintain.ai-Android-Documentation.pdf
          PAGES="$(pdfinfo output/Maintain.ai-Android-Documentation.pdf | awk '/^Pages:/ {print $2}')"
          echo "PDF pages: $PAGES"
          test "$PAGES" -gt 2
          test -s output/Maintain.ai-Android-Documentation.pdf
          test -s output/Maintain.ai-Android-Raw-Markdown.zip

      - name: Upload PDF and raw Markdown
        uses: actions/upload-artifact@v4
        with:
          name: Maintain.ai-Android-Documentation
          path: |
            output/Maintain.ai-Android-Documentation.pdf
            output/Maintain.ai-Android-Raw-Markdown.zip
          retention-days: 90
